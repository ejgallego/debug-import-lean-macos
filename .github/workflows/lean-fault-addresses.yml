name: Lean fault address investigation
on:
  workflow_dispatch:
    inputs:
      platform:
        description: ARM runner selection
        type: choice
        options: [both, linux, macos]
        default: both
  push:
    branches: [experiments/lean-fault-addresses]
permissions:
  contents: read
jobs:
  faults:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.platform == 'linux' && '["ubuntu-24.04-arm"]' || inputs.platform == 'macos' && '["macos-15"]' || '["macos-15","ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build and trace tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libc++-18-dev linux-tools-common "linux-tools-$(uname -r)"
      - name: Probe VM fault tracing
        run: python3 scripts/probe-fault-tools.py
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Download pinned artifacts and source
        run: |
          lake exe cache get
          git diff --exit-code -- lean-toolchain lake-manifest.json
          mkdir -p results/source results/faults
          curl -fsSL https://codeload.github.com/leanprover/lean4/tar.gz/58774429865502f05c63239266aac30ef1e91ef7 -o results/source.tar.gz
          tar -xzf results/source.tar.gz -C results/source --strip-components=1
      - name: Build instrumented Lean and artifact map observer
        shell: bash
        run: |
          python3 scripts/build-lean-inner.py --source results/source --output results/rebuild
          if [ "$RUNNER_OS" = macOS ]; then
            cc -O2 -std=c11 -Wall -Wextra -Werror -dynamiclib repro/lean-io-timing.c -o results/faults/lean-io-timing.dylib
          else
            cc -O2 -std=c11 -Wall -Wextra -Werror -shared -fPIC repro/lean-io-timing.c -ldl -o results/faults/lean-io-timing.so
          fi
      - name: Measure memory activity and trace fault addresses
        run: lake env python3 scripts/run-lean-faults.py --build results/rebuild --output results/faults
      - name: Validate and summarize measurements
        run: python3 scripts/summarize-lean-faults.py results/faults --output results/faults/summary.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lean-faults-${{ matrix.runner }}
          path: |
            results/fault-probe/
            results/faults/
            results/rebuild/build.json
            results/rebuild/Environment.patch
          retention-days: 30
